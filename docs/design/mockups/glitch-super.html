    const offs = new Int8Array(H), src = new Int8Array(H), show = new Uint8Array(H).fill(1);
    let dim = 1, hop = 0, sag = 0, fill = -1;
    for (let i = 0; i < H; i++) { offs[i] = Math.round(g.off[i]); src[i] = i; }
    if (s === 'calm') { const c = sT % 4.6; if (c > 3.9 && c < 4.05) { const r = 2 + Math.floor(ghash(Math.floor(sT / 4.6), 3) * (H - 4)); offs[r] += 2; offs[r + 1] += 2; } }
    if (s === 'happy') { hop = Math.abs(Math.sin(sT * 5.2)) > 0.7 ? 1 : 0; for (let i = 0; i < H; i++) offs[i] += Math.round(1.2 * Math.sin(i * 0.9 - sT * 9)); }
    if (g.pet || s === 'loved') for (let i = 0; i < H; i++) offs[i] += Math.round(0.8 * Math.sin(i * 0.7 - t * 4));
    if (s === 'hungry') { const ph = Math.floor(sT / 0.5) % 2; for (let i = 0; i < H; i++) if (i < S.b0 || i > S.b1 || ((i + ph) % 2 === 0 && i !== S.mr && !(i >= S.er - 1 && i <= S.er + S.eh))) show[i] = 0; dim = 0.85; }
    if (s === 'sad') { sag = 1; dim = 0.62; }
    if (s === 'tired') dim = 0.72;
    if (s === 'charging') fill = gseg(sT % 3.6, 0, 2.9);
    if (eat) fill = eT < 2.4 ? Math.floor(eT / 0.8) / 3 : eT < 3 ? 1 : -1;
    if (g.wind > 0.02) for (let i = 0; i < H; i++) offs[i] += Math.round(g.wind * (1.6 * Math.sin(i * 1.3 + t * 26) + 1.5 * (1 - i / (H - 1))));
    if (clap) { const a = 3.4 * Math.exp(-eT / 0.16) * Math.cos(eT * 26); for (let i = 0; i < H; i++) offs[i] += Math.round(a * ((i >> 1) % 2 ? 1 : -1)); }
    if (shake) { const lock = gseg(eT, 1.5, 2.1), roll = Math.floor((1 - lock) * (1 - lock) * 14 + eT * 9 * (1 - lock));
      const n = S.b1 - S.b0 + 1;
      for (let i = S.b0; i <= S.b1; i++) { src[i] = S.b0 + ((i - S.b0 + roll) % n + n) % n; if (lock < 1) offs[i] += Math.round((ghash(i, Math.floor(eT * 12)) - 0.5) * 5 * (1 - lock)); } }
    for (let i = 0; i < S.b0; i++) offs[i] = offs[S.b0];
    for (let i = S.b1 + 1; i < H; i++) offs[i] = offs[S.b1];
    const lowres = s === 'tired';
    const scan = Math.floor(t * 9) % (H + 8);
    for (let i = 0; i < H; i++) {
      if (!show[i]) continue;
      const row = grid[src[i]];
      const rb = (i % 2 ? 0.36 : 0.44) + (i === scan && !lowres ? 0.3 : 0);
      const filled = fill >= 0 && i >= H - 1 - Math.round(fill * (H - 1)) && fill > 0;
      for (let c = 0; c < W; c++) {
        const cc = lowres ? c - (c % 2) : c;
        let ch = row[cc] === undefined ? '.' : row[cc];
        if (lowres) { const r0 = S.b0 + (src[i] - S.b0) - ((src[i] - S.b0) % 2), a = [grid[r0][cc], grid[r0][cc + 1], (grid[r0 + 1] || [])[cc], (grid[r0 + 1] || [])[cc + 1]];
          const lit = a.filter(q => q && q !== '.').length; ch = lit < 2 ? '.' : a.includes('-') ? '-' : '#'; }
        if (ch === '.') continue;
        const x = S.x0 + c + offs[i] + g.ox;
        let y = S.y0 + i - hop + g.oy;
        if (sag) { const q = (c - (W - 1) / 2) / ((W - 1) / 2); y += Math.round(q * q * (stage + 1)); }
        if (!ok(x, y)) continue;
        let v = ch === '#' ? rb : ch === 'o' ? 1 : ch === '=' ? 0.16 : 0;
        if (filled && ch === '#') v = 0.8;
        b[y * 25 + x] = Math.max(ch === '-' ? 0 : b[y * 25 + x], v * (ch === 'o' && dim < 1 ? 0.8 : dim));
        if (ch === '-') b[y * 25 + x] = 0;
      }
    }
    // the meal: bytes slide in along the mouth's row and are swallowed
    if (eat && eT < 2.4) {
      const p = (eT % 0.8) / 0.55, y = S.y0 + S.mr + g.oy, xm = S.x0 + W;
      if (p < 1) { const head = Math.round(22 - (22 - xm) * p - 4 * p); const xs = []; for (let k = 0; k < 5; k++) { const x = head + k; if (ok(x, y) && x >= xm) xs.push([x, 1 - k * 0.12]); }
        if (xs.length >= 4 || (xs.length && xs[0][0] === xm)) for (const [x, v] of xs) b[y * 25 + x] = v; }
    }
    return b;
  };
  return g;
}

// The game: bad pixels flicker on the screen; lean steps the little Bit to one, and standing on it it patches it.
function makeGlitchGame(stage, MASK) {
  const bit = makeGlitch(0, MASK); bit.demo = false;
  const gm = { bit, x: 12, y: 12, acc: 0, got: 0, seed: 11, bugs: [], hold: 0, glad: 0, tx: 0, ty: 0, t: 0 };
  const rnd = () => { gm.seed = (gm.seed * 1103515245 + 12345) & 0x7fffffff; return gm.seed / 0x7fffffff; };
  const spot = () => { for (let i = 0; i < 30; i++) { const x = 4 + 2 * Math.floor(rnd() * 9), y = 6 + 2 * Math.floor(rnd() * 7);
    if (Math.hypot(x - 12, y - 12) < 9 && Math.hypot(x - gm.x, y - gm.y) > 6 && gm.bugs.every(q => Math.hypot(x - q.x, y - q.y) > 5)) return { x, y }; } return { x: 24 - gm.x, y: 24 - gm.y }; };
  for (let i = 0; i < 2; i++) gm.bugs.push(spot());
  gm.step = dt => {
    gm.t += dt; gm.glad -= dt; gm.acc += dt;
    const on = gm.bugs.findIndex(q => Math.abs(q.x - gm.x) <= 1 && Math.abs(q.y - gm.y) <= 1);
    if (gm.acc >= 0.13) { gm.acc = 0;
      const ax = Math.abs(gm.tx) > 0.22 ? Math.sign(gm.tx) : 0, ay = Math.abs(gm.ty) > 0.22 ? Math.sign(gm.ty) : 0;
      const nx = gm.x + ax, ny = gm.y + ay;
      if (Math.hypot(nx - 12, ny - 12) <= 7.5) { gm.x = nx; gm.y = ny; } else if (Math.hypot(nx - 12, gm.y - 12) <= 7.5) gm.x = nx; else if (Math.hypot(gm.x - 12, ny - 12) <= 7.5) gm.y = ny;
    }
    if (on >= 0) { gm.hold += dt; if (gm.hold >= 0.5) { gm.got++; gm.glad = 0.5; gm.hold = 0; gm.bugs[on] = spot(); } } else gm.hold = 0;
    bit.ox = gm.x - 12; bit.oy = gm.y - 15; bit.tx = gm.tx * 0.7;
    bit.state = gm.glad > 0 ? 'happy' : 'calm'; if (gm.glad > 0) bit.sT = 0.25; else bit.sT = 0.5;
    bit.step(dt);
  };
  gm.draw = () => {
    const b = bit.draw();
    gm.bugs.forEach((q, i) => {
      const fl = Math.floor(gm.t * 9 + i * 3) % 3;
      for (let dy = 0; dy < 2; dy++) for (let dx = 0; dx < 2; dx++) { const x = q.x + dx, y = q.y + dy; if (x >= 0 && x < 25 && y >= 0 && y < 25 && MASK[y * 25 + x] === '1' && !(b[y * 25 + x] > 0)) b[y * 25 + x] = fl === 0 ? 1 : (dx + dy + fl) % 2 ? 0.55 : 0.3; }
    });
    return b;
  };
  return gm;
}

const NAMES={calm:'Покой',happy:'Радость',habit:'Привычка: загрузка',hungry:'Голод',sad:'Грусть',tired:'Усталость',asleep:'Сон',eating:'Еда',loved:'Гладят',dizzy:'Встряхнули',tilt:'Наклон',charging:'Зарядка',wind:'Подули',clap:'Хлопок',game:'Игра'};
const STAGES=['Бит','Глитч','Ядро'];
const dec=s=>{const o=[];for(const ch of s){if(ch>='0'&&ch<='9')o.push(+ch/9);else for(let i=ch.charCodeAt(0)-96;i>0;i--)o.push(0);}while(o.length<625)o.push(0);return o;};
const cache={};const oldFrames=(st,s)=>cache[st+s]||(cache[st+s]=(OLD[st][s]||[]).map(dec));
function paint(cv,buf){const g=cv.getContext('2d'),c=cv.width/25;g.clearRect(0,0,cv.width,cv.height);
  for(let i=0;i<625;i++){if(MASK[i]!=='1')continue;const v=buf?buf[i]:0,l=v>0?Math.round(40+215*Math.pow(v,0.8)):22;
    g.fillStyle='rgb('+l+','+l+','+l+')';g.beginPath();g.arc((i%25+.5)*c,(Math.floor(i/25)+.5)*c,c*.38,0,7);g.fill();}}
let stage=2,state='calm',main,game,cells=[];
const $=id=>document.getElementById(id);
function build(){
  main=makeGlitch(stage,MASK);main.set(state==='game'?'calm':state);game=state==='game'?makeGlitchGame(stage,MASK):null;
  $('stages').innerHTML='';STAGES.forEach((n,i)=>{const b=document.createElement('button');b.textContent=n;b.className=i===stage?'on':'';b.onclick=()=>{stage=i;build();};$('stages').appendChild(b);});
  $('states').innerHTML='';Object.keys(NAMES).forEach(k=>{const b=document.createElement('button');b.textContent=NAMES[k];b.className=k===state?'on':'';b.onclick=()=>{state=k;build();};$('states').appendChild(b);});
  $('hint').textContent=state==='game'?'Игра: води мышью по правой матрице, это наклон телефона. На экране мигают битые пиксели; малыш Бит шагает к ним по клеткам и, постояв на пикселе, чинит его. Счёта на матрице нет: в телефоне каждая починка отдаётся в руке.'
    :'Потяни мышью по правой матрице влево-вправо: это наклон телефона. Каждая строка картинки на своей пружине, верхние самые мягкие. Кнопки ниже состояний работают в любом состоянии.';
  $('grid').innerHTML='';cells=[];
  Object.keys(NAMES).forEach(k=>{const d=document.createElement('div');d.className='cell';d.innerHTML='<span>'+NAMES[k]+'</span>';
    const a=document.createElement('canvas'),b=document.createElement('canvas');a.width=a.height=b.width=b.height=110;d.appendChild(a);d.appendChild(b);
    d.onclick=()=>{state=k;build();scrollTo({top:0,behavior:'smooth'});};$('grid').appendChild(d);
    const rig=k==='game'?makeGlitchGame(stage,MASK):makeGlitch(stage,MASK);if(k!=='game')rig.set(k);cells.push({k,a,b,rig});});
}
const acts=[['Подуть (держи)','blow',1],['Погладить (держи)','pet',1],['Хлопок','clap',0],['Встряхнуть','shake',0],['Покормить','eat',0]];
acts.forEach(([n,k,hold])=>{const b=document.createElement('button');b.textContent=n;b.className='act';
  if(hold){const on=()=>{main.demo=false;main[k]=true;},off=()=>{main[k]=false;};b.onpointerdown=on;b.onpointerup=off;b.onpointerleave=off;}
  else b.onclick=()=>{main.demo=false;main.fire(k);};$('acts').appendChild(b);});
let drag=false;const nv=$('new');
const lean=e=>{const r=nv.getBoundingClientRect();return[Math.max(-1,Math.min(1,((e.clientX-r.left)/r.width-.5)*2.4)),Math.max(-1,Math.min(1,((e.clientY-r.top)/r.height-.5)*2.4))];};
nv.onpointerdown=e=>{drag=true;nv.setPointerCapture(e.pointerId);main.demo=false;[main.tx,main.ty]=lean(e);};
nv.onpointermove=e=>{if(game){[game.tx,game.ty]=lean(e);}else if(drag){[main.tx,main.ty]=lean(e);}};
nv.onpointerup=()=>{drag=false;main.tx=0;main.ty=0;};
nv.onpointerleave=()=>{if(game){game.tx=0;game.ty=0;}};
function autoGame(g){const z=g.bugs[0];g.tx=Math.sign(z.x-g.x)*.6;g.ty=Math.sign(z.y-g.y)*.6;}
let last=0,clock=0;
function frame(now){const dt=Math.max(0,Math.min(.05,(now-last)/1000));last=now;clock+=dt;
  const fi=s=>{const f=oldFrames(stage,s);return f.length?f[Math.floor(clock/.16)%f.length]:null;};
  paint($('old'),fi(state));
  if(game){game.step(dt);paint(nv,game.draw());}else{main.step(dt);paint(nv,main.draw());}
  for(const c of cells){paint(c.a,fi(c.k));if(c.k==='game')autoGame(c.rig);c.rig.step(dt);paint(c.b,c.rig.draw());}
  requestAnimationFrame(frame);}
build();requestAnimationFrame(frame);
</script></body></html>
