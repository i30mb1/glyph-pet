      const per = { clap: 2.6, eating: 3.6, dizzy: 3.4 }[s];
      if (per && sT >= h.next) { h.fire(s === 'clap' ? 'clap' : s === 'eating' ? 'eat' : 'shake'); h.next = sT + per; }
      if (s === 'wind') h.blow = sT % 4.2 < 2.4;
      if (s === 'loved') h.pet = true;
      if (s === 'tilt') { h.tx = clamp(1.4 * Math.sin(sT * 1.5), -1, 1); h.ty = clamp(1.3 * Math.sin(sT * 0.9 + 1), -1, 1); }
    }
    const T = { spin: 1, m: 1, br: 1, sag: 0, tear: 0, incl: 0.3, phi: -0.12, jet: 0 };
    if (s === 'happy') T.spin = 3;
    if (s === 'habit') T.jet = Math.sin(seg(sT % 3.2, 0.4, 2.6) * Math.PI);
    if (s === 'hungry') { T.m = 0.02; T.spin = 0.6; }
    if (s === 'sad') { T.spin = 0.3; T.br = 0.6; T.sag = 1; T.tear = 1; T.m = 0.7; }
    if (s === 'tired') { T.spin = 0.4; T.br = 0.75; T.incl = mix(0.34, 0.15, seg(sT % 3.2, 0, 2.5)); }
    if (s === 'asleep') { T.spin = 0; T.br = 0.42; T.incl = 0.15; T.phi = 0; T.m = 0.5; }
    if (s === 'charging') { T.m = 0.02 + 1.08 * seg(sT % 3.6, 0, 2.9); T.spin = 0.6 + 1.6 * seg(sT % 3.6, 0, 2.9); }
    if (h.pet) T.spin = 2.2;
    if (h.blow) T.m = Math.min(T.m, 0.6);
    if (h.ev === 'eat') { if (h.eT > 1.8 && h.eT < 2.7) T.m = 1.4; if (h.eT > 1.5) T.spin = 2; if (h.eT > 3.2) h.ev = null; }
    if (h.ev === 'clap' && h.eT > 1.5) h.ev = null;
    const k = Math.min(1, dt * 4);
    for (const key of ['spin', 'm', 'br', 'sag', 'tear']) h[key] += (T[key] - h[key]) * k;
    h.jet = T.jet;
    h.wind += ((h.blow ? 1 : 0) - h.wind) * Math.min(1, dt * 5);
    T.incl = clamp(T.incl + h.ty * 0.42, 0.15, 0.8); T.phi += h.tx * 0.6;
    if (h.dizzy > 0) {
      h.dizzy -= dt;
      h.phi += dt * 7 * Math.min(1, h.dizzy / 0.6 + 0.15); h.incl = 0.32 + 0.14 * Math.sin(h.t * 9);
      if (h.dizzy <= 0) { h.phi = ((h.phi + Math.PI / 2) % Math.PI + Math.PI) % Math.PI - Math.PI / 2; h.phiV = 3; h.inclV = 0; }
    } else {
      h.inclV += ((T.incl - h.incl) * 70 - h.inclV * 6) * dt; h.incl = clamp(h.incl + h.inclV * dt, 0.1, 0.9);
      h.phiV += ((T.phi - h.phi) * 70 - h.phiV * 6) * dt; h.phi += h.phiV * dt;
    }
    h.rot += h.spin * dt * 2.2;
  };

  const proj = (r, a, inc) => {
    const cp = Math.cos(h.phi), sp = Math.sin(h.phi), dx = r * Math.cos(a), dy = r * Math.sin(a) * (inc || h.incl);
    return [h.cx + dx * cp - dy * sp, h.cy + dx * sp + dy * cp];
  };
  const star = (x, y, b) => { put(x, y, b); put(x + 1, y, 0.35 * b); put(x - 1, y, 0.35 * b); put(x, y + 1, 0.35 * b); put(x, y - 1, 0.35 * b); };
  h.star = star; h.put = put;

  h.draw = () => {
    const b = h.buf; b.fill(0);
    const P = h.P, s = h.state, t = h.t, sT = h.sT, ev = h.ev, eT = h.eT;
    const clap = ev === 'clap', eat = ev === 'eat';
    const shrink = clap && eT < 0.3 ? 1 : 0;
    const rc = P.rc - shrink;
    const cx = h.cx, cy = h.cy - (s === 'happy' && Math.abs(Math.sin(sT * 5)) > 0.75 ? 1 : 0);
    const cp = Math.cos(h.phi), sp = Math.sin(h.phi), incl = h.incl;
    const fling = clap ? 1 + 0.18 * (1 - seg(eT, 0, 0.35)) : 1;
    const mm = Math.min(h.m, 1), rmF = (P.r1 + P.r2) / 2 + (stage === 2 ? 1 : 0.6) * (1 - mm);
    const r1 = mix(rmF, P.r1, mm) * fling, r2e = (mix(rmF, P.r2, mm) + Math.max(0, h.m - 1) * 2.5) * fling;
    const rm = (r1 + r2e) / 2, half = (r2e - r1) / 2, discOn = h.m > 0.012;
    let ringB = 0.75 * Math.max(h.br, 0.45);
    if (s === 'asleep') ringB = 0.36 + 0.1 * Math.sin(t * 1.6);
    if (s === 'happy') ringB = 0.8 + 0.2 * Math.sin(sT * 10);
    if (s === 'calm' && sT % 8 > 6 && sT % 8 < 6.3) ringB = 1;
    if (eat && eT > 1.8 && eT < 2.3) ringB = 1;
    const thick = (h.pet && Math.sin(t * 7) > 0) || (eat && eT > 1.8 && eT < 2.2);
    // one wave going out (a clap, a gulp)
    let waveR = -1, waveB = 0;
    if (clap && eT < 0.6) { waveR = rc + 2 + eT / 0.6 * (9 - rc); waveB = 0.6 * (1 - eT / 0.6); }
    if (h.pet) { const q = (t % 1.3) / 1.3; waveR = rc + 2 + q * (9 - rc); waveB = 0.22 * (1 - q); }
    const jl = h.jet * (P.rc + 5);
    // eyes first: where they are, so nothing lit touches them
    const eyes = [];
    let mode = 'open', lx = 0, ly = 0;
    if (s === 'calm') { const c = sT % 8; if (c > 2 && c < 2.5) lx = -1; if (c > 3.6 && c < 4.1) lx = 1; }
    if (s === 'happy' || s === 'habit' || s === 'loved' || h.pet) mode = 'happy';
    if (s === 'hungry') { lx = sT % 3.2 < 2.4 ? 1 : 0; }
    if (s === 'sad') mode = 'half';
    if (s === 'tired') { const c = sT % 3.2; mode = c < 1 ? 'half' : c < 2.5 ? 'closed' : c < 2.8 ? 'wide' : 'open'; }
    if (s === 'asleep') mode = 'closed';
    if (s === 'charging' && sT % 3.6 > 2.7) mode = 'happy';
    if (h.wind > 0.3) mode = 'half';
    if (eat) { if (eT < 1.8) { const a = -0.9 + Math.pow(seg(eT, 0, 1.8), 1) * 6.5; lx = Math.cos(a) > 0.3 ? 1 : Math.cos(a) < -0.3 ? -1 : 0; } else mode = 'happy'; }
    if (clap) { if (eT < 0.45) mode = 'wide'; else if (eT < 0.9) lx = -1; else if (eT < 1.35) lx = 1; }
    if (h.dizzy > 0) mode = 'dizzy';
    if (mode === 'open' && t % 2.6 < 0.14) mode = 'closed';
    const ex = P.ex, ey = P.ey, eh = P.eh;
    for (const sd of [-1, 1]) {
      const x0 = cx + sd * ex + lx;
      if (mode === 'open') for (let j = 0; j < eh; j++) eyes.push([x0, cy + ey + j + ly, 1]);
      if (mode === 'wide') { for (let j = 0; j < Math.max(2, eh); j++) { eyes.push([x0, cy + ey + j - (eh < 2 ? 1 : 0), 1]); if (stage > 0) eyes.push([x0 + sd, cy + ey + j, 1]); } }
      if (mode === 'half') eyes.push([x0, cy + ey + eh - 1, 0.85]);
      if (mode === 'closed') { eyes.push([x0, cy + ey + eh - 1, 0.3]); if (stage > 0) eyes.push([x0 + sd, cy + ey + eh - 1, 0.3]); }
      if (mode === 'happy') { if (stage === 0) eyes.push([x0, cy + ey, 1]); else { eyes.push([x0, cy + ey, 1]); eyes.push([x0 - 1, cy + ey + 1, 1]); eyes.push([x0 + 1, cy + ey + 1, 1]); } }
      if (mode === 'dizzy') eyes.push([x0, cy + ey + ((Math.floor(t * 6) + (sd > 0 ? 1 : 0)) % 2) * (eh > 1 ? 1 : 0) - (eh > 1 ? 0 : (Math.floor(t * 6) + (sd > 0 ? 1 : 0)) % 2), 1]);
    }
    const nearEye = (x, y) => eyes.some(e => Math.abs(e[0] - x) <= 1 && Math.abs(e[1] - y) <= 1);

    for (let y = 0; y < 25; y++) for (let x = 0; x < 25; x++) {
      if (!ok(x, y)) continue;
      const dx = x - cx, dy = y - cy, d = Math.hypot(dx, dy);
      let val = 0;
      // the disc, in its own plane
      let inDisc = false, front = false, db = 0;
      if (discOn) {
        const u = dx * cp + dy * sp, v0 = -dx * sp + dy * cp;
        const uu = u - h.wind * 1.5;
        const lee = Math.max(0, uu / r2e);
        const v = v0 - h.sag * 3.2 * (u / P.r2) * (u / P.r2) - h.wind * lee * 1.3 * Math.sin(u * 0.8 - t * 13);
        const w = v / incl, rho = Math.hypot(uu, w), th = Math.atan2(w, uu);
        const rhoE = rho / (1 + h.wind * 0.7 * Math.max(0, Math.cos(th)));
        const grad = Math.hypot(uu, w / incl) / Math.max(rho, 0.01);
        inDisc = Math.abs(rhoE - rm) <= half || Math.abs(rhoE - rm) / grad <= 0.55;
        if (inDisc && h.tear > 0.3 && Math.sin(2 * th + 0.7) > 1.3 - h.tear) inDisc = false;
        front = v > 0;
        const lobe = Math.max(0, Math.sin(3 * th - h.rot * 3 + 0.5 * rho));
        db = h.br * (0.3 + 0.6 * lobe * lobe) * (1 - 0.45 * h.wind * Math.max(0, -Math.cos(th)));
        if (s === 'asleep') db = 0.26;
      }
      if (inDisc && !front) val = db;
      if (d <= rc + 1) { val = 0; if (d > rc) val = ringB; }
      else if (thick && d <= rc + 2) val = Math.max(val, ringB * 0.8);
      else if (discOn && h.m > 0.3 && incl < 0.5 && s !== 'asleep' && d <= rc + 2 && dy < -rc * 0.35) val = Math.max(val, 0.3 * h.br);
      if (waveR > 0 && Math.abs(d - waveR) <= 0.5 && d > rc + 1) val = Math.max(val, waveB);
      if (jl > 0.5) {
        const al = Math.abs(-dx * sp + dy * cp), ac = Math.abs(dx * cp + dy * sp), q = (al - rc - 1) / jl;
        if (al > rc + 1 && q <= 1 && ac <= 1.6 * (1 - q) + 0.5) val = Math.max(val, 0.45 + 0.5 * Math.pow(Math.max(0, Math.sin(al * 1.1 - t * 14)), 2));
      }
      if (inDisc && front && !(d <= rc + 0.2 && nearEye(x, y))) val = Math.max(d <= rc + 1 ? 0 : val, db);
      b[y * 25 + x] = Math.min(1, val);
    }
    // the meal: a star stretched into a stream that winds into the disc
    if (eat && eT < 1.8) {
      const p = seg(eT, 0, 1.8), len = 0.06 + 0.3 * p, pts = new Map();
      for (let q = Math.max(0, p - len); q <= p; q += 0.004) {
        const r = mix(11, rm, Math.pow(q, 1.3)), a = -0.9 + q * 6.5;
        const [x, y] = proj(r, a, mix(0.85, h.incl, q * q));
        if (Math.sin(a) < 0 && Math.hypot(x - cx, y - cy) < rc + 1.3) continue;
        if (Math.hypot(Math.round(x) - cx, Math.round(y) - cy) <= rc + 0.2) continue;
        if (ok(Math.round(x), Math.round(y))) pts.set(Math.round(y) * 25 + Math.round(x), 1 - (p - q) / len * 0.65);
      }
      if (pts.size >= 4) pts.forEach((v, k) => put(k % 25, Math.floor(k / 25), v));
    }
    if (s === 'hungry') {
      const sx = 19, sy = 5, pull = Math.max(0, Math.sin(sT * 3.9)) * (stage + 2);
      star(sx, sy, 1);
      const ux = (cx - sx) / Math.hypot(cx - sx, cy - sy), uy = (cy - sy) / Math.hypot(cx - sx, cy - sy);
      for (let q = 1; q <= pull; q += 0.5) put(sx + ux * q, sy + uy * q, 0.9 - q * 0.15);
    }
    if (s === 'asleep') {
      const p = (sT % 2.6) / 2.6, a = p * 6, r = 9 - p * 3, zb = 0.55 * (1 - p) + 0.1;
      const zx = Math.round(17 + p * 2), zy = Math.round(6 - p * 3);
      [[0, 0], [1, 0], [2, 0], [1, 1], [0, 2], [1, 2], [2, 2]].forEach(([i, j]) => put(zx + i, zy + j, zb));
    }
    for (const e of eyes) set(e[0], e[1], e[2]);
    return b;
  };
  return h;
}

// The game: lean rolls the hole to the stars; a star near it is stretched into a stream and swallowed.
function makeGame(stage, MASK) {
  const hole = makeHole(0, MASK);
  hole.demo = false;
  const g = { hole, x: 12, y: 12, vx: 0, vy: 0, got: 0, seed: 7, stars: [], happy: 0, tx: 0, ty: 0, t: 0 };
  const rnd = () => { g.seed = (g.seed * 1103515245 + 12345) & 0x7fffffff; return g.seed / 0x7fffffff; };
  const spot = () => { for (let i = 0; i < 20; i++) { const a = rnd() * 6.283, r = 4 + rnd() * 5.5, x = 12 + Math.cos(a) * r, y = 12 + Math.sin(a) * r;
    if (Math.hypot(x - g.x, y - g.y) > 6.5 && g.stars.every(s => Math.hypot(x - s.x, y - s.y) > 5)) return { x, y, pull: -1 }; } return { x: 24 - g.x, y: 24 - g.y, pull: -1 }; };
  for (let i = 0; i < 2; i++) g.stars.push(spot());
  g.step = dt => {
    g.t += dt; g.happy -= dt;
    const heavy = 1 + Math.min(g.got, 14) * 0.07, k = Math.min(1, dt * 3 / heavy);
    g.vx += (g.tx * 10 / heavy - g.vx) * k; g.vy += (g.ty * 10 / heavy - g.vy) * k;
    g.x += g.vx * dt; g.y += g.vy * dt;
    const d = Math.hypot(g.x - 12, g.y - 12); if (d > 6.5) { g.x = 12 + (g.x - 12) * 6.5 / d; g.y = 12 + (g.y - 12) * 6.5 / d; }
    hole.cx = Math.round(g.x); hole.cy = Math.round(g.y);
    hole.P.r1 = 5; hole.P.r2 = 5 + Math.min(g.got, 12) * 0.12;
    hole.tx = g.tx * 0.5; hole.ty = 0;
    hole.state = g.happy > 0 ? 'happy' : 'calm'; if (g.happy > 0) hole.sT = 0.2;
    g.stars.forEach((s, i) => {
      if (s.pull >= 0) { s.pull += dt / 0.45; if (s.pull >= 1) { g.got++; g.happy = 0.5; g.stars[i] = spot(); } }
      else if (Math.hypot(s.x - g.x, s.y - g.y) < 6) s.pull = 0;
    });
    hole.step(dt);
  };
  g.draw = () => {
    const b = hole.draw();
    for (const s of g.stars) {
      const sx = Math.round(s.x), sy = Math.round(s.y);
      if (s.pull < 0) { hole.star(sx, sy, 1); continue; }
      const dd = Math.hypot(hole.cx - sx, hole.cy - sy), ux = (hole.cx - sx) / dd, uy = (hole.cy - sy) / dd;
      const head = mix(0, dd - 3.6, ease(s.pull)), tail = mix(0, dd - 3.6, ease(seg(s.pull, 0.35, 1)));
      if (head - tail >= 3) for (let q = tail; q <= head; q += 0.4) hole.put(sx + ux * q, sy + uy * q, 0.55 + 0.45 * (q - tail) / Math.max(0.5, head - tail));
    }
    return b;
  };
  return g;
}

const NAMES={calm:'Покой',happy:'Радость',habit:'Привычка: джеты',hungry:'Голод',sad:'Грусть',tired:'Усталость',asleep:'Сон',eating:'Еда',loved:'Гладят',dizzy:'Встряхнули',tilt:'Наклон',charging:'Зарядка',wind:'Подули',clap:'Хлопок',game:'Игра'};
const STAGES=['Крупинка','Чёрная дыра','Сингулярность'];
const dec=s=>{const o=[];for(const ch of s){if(ch>='0'&&ch<='9')o.push(+ch/9);else for(let i=ch.charCodeAt(0)-96;i>0;i--)o.push(0);}while(o.length<625)o.push(0);return o;};
const cache={};const oldFrames=(st,s)=>cache[st+s]||(cache[st+s]=(OLD[st][s]||[]).map(dec));
function paint(cv,buf){const g=cv.getContext('2d'),c=cv.width/25;g.clearRect(0,0,cv.width,cv.height);
  for(let i=0;i<625;i++){if(MASK[i]!=='1')continue;const v=buf?buf[i]:0,l=v>0?Math.round(40+215*Math.pow(v,0.8)):22;
    g.fillStyle='rgb('+l+','+l+','+l+')';g.beginPath();g.arc((i%25+.5)*c,(Math.floor(i/25)+.5)*c,c*.38,0,7);g.fill();}}
let stage=2,state='calm',main,game,cells=[];
const $=id=>document.getElementById(id);
function build(){
  main=makeHole(stage,MASK);main.set(state==='game'?'calm':state);game=state==='game'?makeGame(stage,MASK):null;
  $('stages').innerHTML='';STAGES.forEach((n,i)=>{const b=document.createElement('button');b.textContent=n;b.className=i===stage?'on':'';b.onclick=()=>{stage=i;build();};$('stages').appendChild(b);});
  $('states').innerHTML='';Object.keys(NAMES).forEach(k=>{const b=document.createElement('button');b.textContent=NAMES[k];b.className=k===state?'on':'';b.onclick=()=>{state=k;build();};$('states').appendChild(b);});
  $('hint').textContent=state==='game'?'Игра: води мышью по правой матрице, это наклон телефона. Дыра катится к звёздам и глотает их, с каждой тяжелеет. Счёта на матрице нет: в телефоне каждая звезда отдаётся в руке.'
    :'Потяни мышью по правой матрице: это наклон телефона, диск на пружине. Кнопки ниже состояний работают в любом состоянии.';
  $('grid').innerHTML='';cells=[];
  Object.keys(NAMES).forEach(k=>{const d=document.createElement('div');d.className='cell';d.innerHTML='<span>'+NAMES[k]+'</span>';
    const a=document.createElement('canvas'),b=document.createElement('canvas');a.width=a.height=b.width=b.height=110;d.appendChild(a);d.appendChild(b);
    d.onclick=()=>{state=k;build();scrollTo({top:0,behavior:'smooth'});};$('grid').appendChild(d);
    const rig=k==='game'?makeGame(stage,MASK):makeHole(stage,MASK);if(k!=='game')rig.set(k);cells.push({k,a,b,rig});});
}
const acts=[['Подуть (держи)','blow',1],['Погладить (держи)','pet',1],['Хлопок','clap',0],['Встряхнуть','shake',0],['Покормить','eat',0]];
acts.forEach(([n,k,hold])=>{const b=document.createElement('button');b.textContent=n;b.className='act';
  if(hold){const on=()=>{main.demo=false;main[k]=true;},off=()=>{main[k]=false;};b.onpointerdown=on;b.onpointerup=off;b.onpointerleave=off;}
  else b.onclick=()=>{main.demo=false;main.fire(k);};$('acts').appendChild(b);});
let drag=false;const nv=$('new');
const lean=e=>{const r=nv.getBoundingClientRect();return[Math.max(-1,Math.min(1,((e.clientX-r.left)/r.width-.5)*2.4)),Math.max(-1,Math.min(1,((e.clientY-r.top)/r.height-.5)*2.4))];};
nv.onpointerdown=e=>{drag=true;nv.setPointerCapture(e.pointerId);main.demo=false;[main.tx,main.ty]=lean(e);};
nv.onpointermove=e=>{if(game){[game.tx,game.ty]=lean(e);}else if(drag){[main.tx,main.ty]=lean(e);}};
nv.onpointerup=()=>{drag=false;main.tx=0;main.ty=0;};
nv.onpointerleave=()=>{if(game){game.tx=0;game.ty=0;}};
function autoGame(g){const z=g.stars[0],d=Math.hypot(z.x-g.x,z.y-g.y)||1;g.tx=(z.x-g.x)/d*.7;g.ty=(z.y-g.y)/d*.7;}
let last=0,clock=0;
function frame(now){const dt=Math.max(0,Math.min(.05,(now-last)/1000));last=now;clock+=dt;
  const fi=s=>{const f=oldFrames(stage,s);return f.length?f[Math.floor(clock/.16)%f.length]:null;};
  paint($('old'),fi(state));
  if(game){game.step(dt);paint(nv,game.draw());}else{main.step(dt);paint(nv,main.draw());}
  for(const c of cells){paint(c.a,fi(c.k));if(c.k==='game')autoGame(c.rig);c.rig.step(dt);paint(c.b,c.rig.draw());}
  requestAnimationFrame(frame);}
build();requestAnimationFrame(frame);
</script></body></html>
