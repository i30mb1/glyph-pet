    th: REST.slice(), om: [0, 0, 0, 0], blow: false, pet: false, wind: 0, ev: null, eT: 0, next: 0.3, q: 0, free: false, buf: new Float32Array(625) };
  const ok = (x, y) => x >= 0 && x < 25 && y >= 0 && y < 25 && MASK[y * 25 + x] === '1';
  const put = (x, y, v) => { x = Math.round(x); y = Math.round(y); if (ok(x, y) && a.buf[y * 25 + x] < v) a.buf[y * 25 + x] = v; };
  const set = (x, y, v) => { x = Math.round(x); y = Math.round(y); if (ok(x, y)) a.buf[y * 25 + x] = v; };
  a.put = put;
  a.set = s => { if (a.state !== s) { a.state = s; a.sT = 0; a.ev = null; a.blow = false; a.pet = false; a.next = 0.3; } };
  a.fire = e => { a.ev = e; a.eT = 0; };
  const homeY = [10, 9, 7][stage];

  a.step = dt => {
    a.t += dt; a.sT += dt; a.eT += dt;
    const s = a.state, t = a.t, sT = a.sT;
    if (a.demo) {
      const per = { clap: 2.6, eating: 4, dizzy: 3.6 }[s];
      if (per && sT >= a.next) { a.fire(s === 'clap' ? 'clap' : s === 'eating' ? 'eat' : 'shake'); a.next = sT + per; }
      if (s === 'wind') a.blow = sT % 4.4 < 2.6;
      if (s === 'loved') a.pet = true;
      if (s === 'tilt') a.tx = aclamp(1.5 * Math.sin(sT * 1.3), -1, 1);
    }
    if (a.ev === 'eat' && a.eT > 3.4) a.ev = null;
    if (a.ev === 'clap' && a.eT > 1.5) a.ev = null;
    if (a.ev === 'shake' && a.eT > 2.4) a.ev = null;
    a.wind += ((a.blow ? 1 : 0) - a.wind) * Math.min(1, dt * 4);

    let hx = 12 + Math.sin(t * 0.45) * 1.2 + a.tx * 5, hy = homeY + Math.sin(t * 0.7) * 1.2 - a.wind * 3;
    let rest = REST.slice(), sway = 0.22, q = 0;
    if (s === 'happy') { q = Math.floor(sT / 0.32) % 4; rest = [1.5, 1.5, 0.6, 0.6]; }
    if (s === 'hungry') { hx -= 3; rest = [0.5, 1.75, 0.3, 0.4]; }
    if (s === 'sad') { hx += 3 * aseg(sT % 6.4, 0, 6.4) - 1; hy += 3; rest = [0.05, 0.05, 0.05, 0.05]; sway = 0.05; }
    if (s === 'tired') { hy += 2.5 * aseg(sT % 3.2, 0, 2.6); rest = [0.1, 0.1, 0.08, 0.08]; sway = 0.06; }
    if (s === 'asleep') { q = 1; hy += 3; rest = [0.2, 0.2, 1.0, 0.1]; sway = 0.05; }
    if (s === 'loved' || a.pet) rest = [0.6, 2.4 + 0.5 * Math.sin(t * 11), 0.22, 0.22];
    if (s === 'habit') { const c = sT % 3.6; if (c > 0.5 && c < 1.3) hx -= 5; else if (c >= 1.3 && c < 2.3) hx += 5; }
    if (s === 'charging') { rest = [0.9, 0.9, 0.3, 0.3]; }
    if (a.ev === 'eat') { hx -= 3; const e = a.eT; rest = e < 0.9 ? [0.5, 1.9, 0.2, 0.2] : e < 2.4 ? [0.5, 2.9, 0.2, 0.2] : [1.6, 1.6, 0.4, 0.4]; }
    if (a.ev === 'clap') { if (a.eT < 0.5) { rest = [2.2, 2.2, 0.9, 0.9]; hy -= 2; } }
    if (a.ev === 'shake') { const k = 1 - aseg(a.eT, 1.5, 2.3); q = Math.floor(a.eT * 9 * k + (1 - k) * 0) % 4; if (k <= 0) q = 0; rest = [1.9, 1.9, 0.8, 0.8]; }
    if (a.wind > 0.1) { rest = rest.map((r, i) => r + a.wind * (i < 2 ? 1.6 : 0.5)); sway += 0.3 * a.wind; }
    a.q = q;
    const k = 14, c = 1.7;
    let left = dt;
    while (left > 0) {
      const h = Math.min(left, 0.01);
      a.ax = (hx - a.x) * k - a.vx * c; a.ay = (hy - a.y) * k - a.vy * c;
      a.vx += a.ax * h; a.vy += a.ay * h; a.x += a.vx * h; a.y += a.vy * h;
      for (let i = 0; i < 4; i++) {
        const side = i % 2 ? 1 : -1;
        const want = rest[i] + sway * Math.sin(t * (0.9 + i * 0.13) + i * 1.7) * (s === 'wind' || a.wind > 0.3 ? Math.sin(t * 9 + i) : 1);
        const acc = (want - a.th[i]) * 26 - a.om[i] * 3.2 - side * a.ax * 0.09 + a.ay * 0.07;
        a.om[i] += acc * h; a.th[i] = aclamp(a.th[i] + a.om[i] * h, -0.5, 3.0);
      }
      left -= h;
    }
  };

  // a body-frame offset turned q quarter turns
  const turn = (dx, dy, q) => q === 0 ? [dx, dy] : q === 1 ? [-dy, dx] : q === 2 ? [-dx, -dy] : [dy, -dx];

  a.draw = () => {
    const b = a.buf; b.fill(0);
    const s = a.state, t = a.t, sT = a.sT, ev = a.ev, eT = a.eT, q = a.q;
    const cx = Math.round(a.x), cy = Math.round(a.y);
    // face
    let eyes = 'open', visor = 0.85, lx = 0;
    if (s === 'happy' || s === 'loved' || a.pet) eyes = 'happy';
    if (s === 'sad') { eyes = 'closed'; visor = 0.6; }
    if (s === 'tired') { const c = sT % 3.2; eyes = c < 2.6 ? 'closed' : 'wide'; visor = c < 2.6 ? 0.55 + 0.12 * Math.sin(sT * 5) : 0.85; }
    if (s === 'asleep') { eyes = 'closed'; visor = 0.55; }
    if (s === 'hungry') lx = 1;
    if (s === 'charging') { visor = 0.35 + 0.6 * aseg(sT % 3.6, 0, 2.9); if (sT % 3.6 > 2.9) eyes = 'happy'; }
    if (a.wind > 0.3) eyes = 'closed';
    if (ev === 'eat') { if (eT > 2.4) eyes = 'happy'; else lx = 1; }
    if (ev === 'clap') { if (eT < 0.5) eyes = 'wide'; else lx = eT < 1 ? -1 : 1; }
    if (ev === 'shake') eyes = aseg(eT, 1.5, 2.3) >= 1 ? 'open' : 'wide';
    if (Math.abs(a.tx) > 0.3 && lx === 0) lx = Math.sign(a.tx);
    if (eyes === 'open' && t % 3 < 0.14) eyes = 'closed';
    if (stage === 0) lx = 0;
    const grid = S.rows.map(r => r.split(''));
    const er = S.cr, ec = half;
    for (const sd of [-1, 1]) {
      const c0 = ec + sd * S.ex;
      grid[er][c0] = 'v';
      if (eyes === 'open') grid[er][c0 + lx] = '-';
      if (eyes === 'closed') grid[er][c0] = 'c';
      if (eyes === 'wide') { grid[er][c0] = '-'; grid[er - 1][c0] = '-'; }
      if (eyes === 'happy') { if (stage === 2) { grid[er - 1][c0] = '-'; grid[er][c0 - 1] = '-'; grid[er][c0 + 1] = '-'; } else grid[er - 1][c0] = '-'; }
    }
    const P = (dx, dy) => { const [rx, ry] = turn(dx, dy, q); return [cx + rx, cy + ry]; };
    // the tether: from its belt down to the rim, slack and swaying, or snapped
    const [bx, by] = P(0, S.tie - S.cr + 1);
    if (!a.free) {
      if (s === 'sad') {
        for (let i = 0; i <= 4; i++) put(bx + (i === 4 ? Math.round(Math.sin(t * 2)) : 0), by + i, 0.24);
      } else {
        const axn = 12, ayn = 24, dist = Math.hypot(bx - axn, by - ayn), slack = Math.max(0, 15 - dist);
        const mx = (bx + axn) / 2 + slack * 0.55 * Math.sin(t * 0.8) + (bx > axn ? -1 : 1) * slack * 0.25, my = (by + ayn) / 2 + slack * 0.2;
        const n = 40, charge = s === 'charging';
        for (let i = 0; i <= n; i++) { const u = i / n, x = (1 - u) * (1 - u) * bx + 2 * u * (1 - u) * mx + u * u * axn, y = (1 - u) * (1 - u) * by + 2 * u * (1 - u) * my + u * u * ayn;
          put(x, y, charge && Math.floor(u * 12 + sT * 6) % 4 === 0 ? 0.9 : 0.22); }
      }
    }
    // limbs: lit tubes from the shoulders and hips, a brighter glove or boot at the end
    const joints = [[-S.arm[0], S.arm[1] - S.cr], [S.arm[0], S.arm[1] - S.cr], [-S.hip[0], S.hip[1] - S.cr], [S.hip[0], S.hip[1] - S.cr]];
    for (let i = 0; i < 4; i++) {
      const side = i % 2 ? 1 : -1, th = a.th[i], [jx, jy] = joints[i];
      let len = S.L + (i < 2 && ev === 'eat' && eT > 0.9 && eT < 2.4 ? 0 : 0);
      if (s === 'asleep' && i >= 2) len = Math.max(1, S.L - 1);
      for (let k = 0; k <= len * 2; k++) { const r = k / 2, [x, y] = P(jx + side * Math.sin(th) * r, jy + Math.cos(th) * r); put(x, y, k >= len * 2 - 1 ? 0.75 : 0.3); }
    }
    // the suit itself
    grid.forEach((row, r) => row.forEach((ch, c) => {
      if (ch === '.') return;
      const [x, y] = P(c - half, r - S.cr);
      set(x, y, ch === '#' ? 0.3 : ch === 'v' ? visor : ch === 'c' ? 0.12 : 0);
    }));
    
    // things about it
    if (s === 'hungry' || (ev === 'eat' && eT < 2.4)) {
      // a food tube: drifting just out of reach, or caught and brought to the helmet
      let fx = Math.min(19, cx + S.arm[0] + S.L + 2 + Math.round(Math.sin(t * 1.3))), fy = cy + 1 + Math.round(Math.cos(t * 0.9));
      if (ev === 'eat') { const p = aease(aseg(eT, 0.2, 0.9)); fx = Math.round(fx + (cx + half + 2 - fx) * p); fy = Math.round(fy + (cy - fy) * p); }
      for (let i = 0; i < 4; i++) put(fx + i, fy, i === 0 ? 1 : 0.55); put(fx + 3, fy - 1, 0.55); put(fx + 3, fy + 1, 0.55);
    }
    if (s === 'habit') { const c = sT % 3.6, on = (c > 0.5 && c < 0.9) ? 1 : (c >= 1.3 && c < 1.7) ? -1 : 0;
      if (on) for (let i = 1; i <= 4; i++) { const [x, y] = P(on * (half + i), 3); put(x, y, 1 - i * 0.18); if (i < 3) { put(x, y - 1, 0.5); put(x, y + 1, 0.5); } } }
    return b;
  };
  return a;
}

// The toy: no goal, just zero gravity. Lean pushes the little Cadet; it drifts on and bounces softly off the rim.
function makeAstroGame(stage, MASK) {
  const h = makeAstro(0, MASK); h.demo = false; h.free = true;
  const g = { hole: h, x: 12, y: 12, vx: 0, vy: 0, tx: 0, ty: 0, got: 0, flash: 0, stars: [{ x: 12, y: 12 }] };
  g.step = dt => {
    g.vx += g.tx * 7 * dt; g.vy += g.ty * 7 * dt; g.x += g.vx * dt; g.y += g.vy * dt; g.flash -= dt;
    const d = Math.hypot(g.x - 12, g.y - 12);
    if (d > 8) { const nx = (g.x - 12) / d, ny = (g.y - 12) / d, vn = g.vx * nx + g.vy * ny; if (vn > 0) { g.vx -= 1.8 * vn * nx; g.vy -= 1.8 * vn * ny; g.flash = 0.25; g.got++; } g.x = 12 + nx * 8; g.y = 12 + ny * 8; }
    // the rig follows the toy's body: its limbs trail by the toy's own acceleration
    const ox = h.x, oy = h.y; h.step(dt);
    h.x = g.x; h.y = g.y - 2; h.vx = g.vx; h.vy = g.vy;
    for (let i = 0; i < 4; i++) { const side = i % 2 ? 1 : -1; h.om[i] += (-side * g.tx * 7 * 0.5 + g.ty * 7 * 0.35 + (g.flash > 0.2 ? side * 6 : 0)) * dt; }
    h.state = g.flash > 0 ? 'clapface' : 'calm';
  };
  g.draw = () => h.draw();
  return g;
}
const NAMES={calm:'Покой',happy:'Радость',habit:'Привычка: пшик ранцем',hungry:'Голод',sad:'Грусть',tired:'Усталость',asleep:'Сон',eating:'Еда',loved:'Гладят',dizzy:'Встряхнули',tilt:'Наклон',charging:'Зарядка',wind:'Подули',clap:'Хлопок',game:'Игра'};
const STAGES=['Кадет','Космонавт','Командир'];
const dec=s=>{const o=[];for(const ch of s){if(ch>='0'&&ch<='9')o.push(+ch/9);else for(let i=ch.charCodeAt(0)-96;i>0;i--)o.push(0);}while(o.length<625)o.push(0);return o;};
const cache={};const oldFrames=(st,s)=>cache[st+s]||(cache[st+s]=(OLD[st][s]||[]).map(dec));
function paint(cv,buf){const g=cv.getContext('2d'),c=cv.width/25;g.clearRect(0,0,cv.width,cv.height);
  for(let i=0;i<625;i++){if(MASK[i]!=='1')continue;const v=buf?buf[i]:0,l=v>0?Math.round(40+215*Math.pow(v,0.8)):22;
    g.fillStyle='rgb('+l+','+l+','+l+')';g.beginPath();g.arc((i%25+.5)*c,(Math.floor(i/25)+.5)*c,c*.38,0,7);g.fill();}}
let stage=2,state='calm',main,game,cells=[];
const $=id=>document.getElementById(id);
function build(){
  main=makeAstro(stage,MASK);main.set(state==='game'?'calm':state);game=state==='game'?makeAstroGame(stage,MASK):null;
  $('stages').innerHTML='';STAGES.forEach((n,i)=>{const b=document.createElement('button');b.textContent=n;b.className=i===stage?'on':'';b.onclick=()=>{stage=i;build();};$('stages').appendChild(b);});
  $('states').innerHTML='';Object.keys(NAMES).forEach(k=>{const b=document.createElement('button');b.textContent=NAMES[k];b.className=k===state?'on':'';b.onclick=()=>{state=k;build();};$('states').appendChild(b);});
  $('hint').textContent=state==='game'?'Игрушка без цели: води мышью по правой матрице, это наклон телефона. Кадет отвязан от троса, наклон его подталкивает, он плывёт по инерции и мягко отскакивает от края (в телефоне удар отдаётся в руке).'
    :'Потяни мышью по правой матрице влево-вправо: это наклон телефона. Космонавт плывёт туда с запозданием, руки и ноги отстают и догоняют, трос тянется следом. Кнопки ниже состояний работают в любом состоянии.';
  $('grid').innerHTML='';cells=[];
  Object.keys(NAMES).forEach(k=>{const d=document.createElement('div');d.className='cell';d.innerHTML='<span>'+NAMES[k]+'</span>';
    const a=document.createElement('canvas'),b=document.createElement('canvas');a.width=a.height=b.width=b.height=110;d.appendChild(a);d.appendChild(b);
    d.onclick=()=>{state=k;build();scrollTo({top:0,behavior:'smooth'});};$('grid').appendChild(d);
    const rig=k==='game'?makeAstroGame(stage,MASK):makeAstro(stage,MASK);if(k!=='game')rig.set(k);cells.push({k,a,b,rig});});
}
const acts=[['Подуть (держи)','blow',1],['Погладить (держи)','pet',1],['Хлопок','clap',0],['Встряхнуть','shake',0],['Покормить','eat',0]];
acts.forEach(([n,k,hold])=>{const b=document.createElement('button');b.textContent=n;b.className='act';
  if(hold){const on=()=>{main.demo=false;main[k]=true;},off=()=>{main[k]=false;};b.onpointerdown=on;b.onpointerup=off;b.onpointerleave=off;}
  else b.onclick=()=>{main.demo=false;main.fire(k);};$('acts').appendChild(b);});
let drag=false;const nv=$('new');
const lean=e=>{const r=nv.getBoundingClientRect();return[Math.max(-1,Math.min(1,((e.clientX-r.left)/r.width-.5)*2.4)),Math.max(-1,Math.min(1,((e.clientY-r.top)/r.height-.5)*2.4))];};
nv.onpointerdown=e=>{drag=true;nv.setPointerCapture(e.pointerId);main.demo=false;[main.tx,main.ty]=lean(e);};
nv.onpointermove=e=>{if(game){[game.tx,game.ty]=lean(e);}else if(drag){[main.tx,main.ty]=lean(e);}};
nv.onpointerup=()=>{drag=false;main.tx=0;main.ty=0;};
nv.onpointerleave=()=>{if(game){game.tx=0;game.ty=0;}};
let agt=0;function autoGame(g){agt+=.016;g.tx=Math.sin(agt*1.1)*.8;g.ty=Math.cos(agt*.7)*.8;}
let last=0,clock=0;
function frame(now){const dt=Math.max(0,Math.min(.05,(now-last)/1000));last=now;clock+=dt;
  const fi=s=>{const f=oldFrames(stage,s);return f.length?f[Math.floor(clock/.16)%f.length]:null;};
  paint($('old'),fi(state));
  if(game){game.step(dt);paint(nv,game.draw());}else{main.step(dt);paint(nv,main.draw());}
  for(const c of cells){paint(c.a,fi(c.k));if(c.k==='game')autoGame(c.rig);c.rig.step(dt);paint(c.b,c.rig.draw());}
  requestAnimationFrame(frame);}
build();requestAnimationFrame(frame);
